# SmartShield — Production Docker Compose
# =========================================
# Services:
#   api        — FastAPI backend + ML models
#   postgres   — PostgreSQL 16
#   redis      — Redis 7 (caching + rate limiting)
#   nginx      — Reverse proxy + SSL termination
#   prometheus — Metrics collection
#   grafana    — Metrics visualization
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f api

version: "3.9"

networks:
  smartshield_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  model_weights:
  prometheus_data:
  grafana_data:
  nginx_certs:

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: smartshield-api:latest
    container_name: smartshield_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartshield:${POSTGRES_PASSWORD}@postgres:5432/smartshield
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PATH=/app/models/bert_v1
      - WORKERS=4
      - DEBUG=false
      - ALLOWED_ORIGINS=https://yourdomain.com
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - model_weights:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smartshield_net
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 4G

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartshield_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartshield
      - POSTGRES_USER=smartshield
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshield -d smartshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartshield_net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartshield_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartshield_net

  # ── NGINX ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smartshield_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_certs:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - smartshield_net

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: smartshield_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - smartshield_net

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: smartshield_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - smartshield_net
