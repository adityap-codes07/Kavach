# Kavach — Nginx Configuration
# =====================================
# Features:
#   - SSL/TLS termination with modern cipher suite
#   - HTTP → HTTPS redirect
#   - Gzip compression
#   - Security headers (HSTS, CSP, X-Frame-Options)
#   - Rate limiting (100 req/min per IP)
#   - Proxy to FastAPI backend
#   - WebSocket support for future real-time features

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=100r/m;
    limit_req_zone  $binary_remote_addr zone=analyze:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstream backend (FastAPI)
    upstream kavach_api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS API server ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name kavach-api.yourdomain.com;

        # SSL configuration
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options       "nosniff"                       always;
        add_header X-Frame-Options              "DENY"                          always;
        add_header X-XSS-Protection             "1; mode=block"                 always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy      "default-src 'self'; script-src 'self'; object-src 'none';" always;
        add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;

        # Client body size (for .eml file uploads)
        client_max_body_size 6M;

        # Connection limits
        limit_conn conn 20;

        # Health check (no rate limit)
        location = /health {
            proxy_pass         http://kavach_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        location = /ready {
            proxy_pass         http://kavach_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # Analysis endpoints (stricter rate limit)
        location ~ ^/api/v1/analyze {
            limit_req zone=analyze burst=10 nodelay;
            limit_req_status 429;

            proxy_pass          http://kavach_api;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass          http://kavach_api;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";
            proxy_read_timeout  60s;
        }

        # OpenAPI docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass         http://kavach_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # Default 404
        location / {
            return 404 '{"detail":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
