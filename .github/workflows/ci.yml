# SmartShield — GitHub Actions CI/CD Pipeline
# =============================================
# Stages:
#   1. test       → unit tests + coverage
#   2. lint       → ruff + mypy
#   3. build      → Docker image
#   4. evaluate   → model benchmark (on schedule)
#   5. deploy     → push to registry + Kubernetes rollout

name: SmartShield CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run model evaluation weekly on Sundays at 02:00 UTC
    - cron: "0 2 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smartshield-api
  PYTHON_VERSION: "3.11"

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Backend Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartshield_test
          POSTGRES_USER: smartshield
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov factory-boy httpx

      - name: Run unit and integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://smartshield:testpass@localhost:5432/smartshield_test
          REDIS_URL: redis://localhost:6379/1
          MODEL_PATH: tests/fixtures/mock_model
          DEBUG: "true"
        run: |
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --timeout=60 \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: backend/coverage.xml
          flags: backend

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Linting & Type Checking
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check app/ --select=E,W,F,I,N,UP --output-format=github

      - name: Run mypy type checker
        working-directory: backend
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Extension Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-extension:
    name: Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Type check TypeScript
        working-directory: extension
        run: npm run type-check

      - name: Run Jest tests
        working-directory: extension
        run: npm test -- --coverage --watchAll=false

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartshield-extension-dist
          path: extension/dist/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Docker Build
  # ─────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Deploy to Kubernetes
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://smartshield-api.yourdomain.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Run database migrations
        run: |
          kubectl exec -n smartshield deploy/smartshield-api \
            -- alembic upgrade head

      - name: Deploy new image
        run: |
          kubectl set image -n smartshield \
            deployment/smartshield-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}

      - name: Wait for rollout
        run: |
          kubectl rollout status -n smartshield deployment/smartshield-api \
            --timeout=300s

      - name: Run smoke tests
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          curl -f "${API_URL}/health" || exit 1
          curl -f "${API_URL}/ready"  || exit 1
          echo "✅ Smoke tests passed"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ SmartShield deployed successfully to production (SHA: ${{ github.sha }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo -n smartshield deployment/smartshield-api
          echo "⏪ Rolled back to previous version"

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Scheduled Model Evaluation (weekly)
  # ─────────────────────────────────────────────────────────────────────────
  evaluate-models:
    name: Weekly Model Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ML dependencies
        run: pip install -r backend/requirements.txt

      - name: Download test dataset
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp s3://smartshield-datasets/test.jsonl data/processed/test.jsonl

      - name: Download model checkpoints
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync s3://smartshield-models/checkpoints/ checkpoints/

      - name: Run evaluation
        run: |
          python ml/evaluation/evaluate_models.py \
            --model_dir checkpoints \
            --test_data data/processed/test.jsonl \
            --output_dir evaluation/results

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_number }}
          path: evaluation/results/
          retention-days: 90
